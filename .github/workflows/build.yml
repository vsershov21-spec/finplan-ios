name: Проверка сборки
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode и XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
      - name: Проект
        run: xcodegen generate
      - name: Сборка для симулятора
        run: |
          set -o pipefail
          xcodebuild -project Finplan.xcodeproj -scheme Finplan -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*Finplan|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Сборка для Mac (Mac Catalyst)
        run: |
          set -o pipefail
          xcodebuild -project Finplan.xcodeproj -scheme Finplan -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build-mac CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-mac.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build-mac.log
      - name: Запуск в симуляторе и снимок экрана
        run: |
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" build/Build/Products/Debug-iphonesimulator/Finplan.app
          xcrun simctl launch "$DEV" com.vershov.finplan
          sleep 25
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/launch.png
          xcrun simctl ui "$DEV" appearance dark; sleep 4
          xcrun simctl io "$DEV" screenshot shots/launch-dark.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Finplan"' --style compact > shots/app.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            shots
            build.log
            build-mac.log
      - name: Результаты в ветку ci-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -R shots /tmp/res/ 2>/dev/null || true
          grep -E "error:|warning:" build.log 2>/dev/null | sed "s|$PWD/||" | sort -u > /tmp/res/warnings.txt || true
          tail -60 build.log > /tmp/res/build-tail.txt 2>/dev/null || true
          cd /tmp/res && git init -q -b ci-results && git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-results
