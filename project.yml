name: Finplan
options:
  bundleIdPrefix: com.vershov
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
targets:
  Finplan:
    type: application
    platform: iOS
    sources:
      - path: Finplan
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vershov.finplan
        PRODUCT_NAME: Finplan
        INFOPLIST_FILE: Finplan/Info.plist
        CODE_SIGN_ENTITLEMENTS: Finplan/Finplan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: FinplanWidget
        embed: true
  FinplanWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FinplanWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vershov.finplan.widget
        PRODUCT_NAME: FinplanWidget
        INFOPLIST_FILE: FinplanWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinplanWidget/FinplanWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  Finplan:
    build:
      targets:
        Finplan: all
        FinplanWidget: all
    run:
      config: Debug
    archive:
      config: Release
